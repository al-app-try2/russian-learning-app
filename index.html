<body>

<h1>🇷🇺 ロシア語学習</h1>

<div id="progress"></div>

<div id="app"></div>

<div class="backup-tools" aria-label="学習記録の管理">
    <button type="button" onclick="exportLearningData()">学習記録を書き出す</button>
    <button type="button" onclick="document.getElementById('backupFileInput').click()">バックアップを読み込む</button>
    <input id="backupFileInput" type="file" accept=".json,application/json" hidden onchange="importLearningData(event)">
    <p class="small">学習記録はこのブラウザに保存されます。機種変更時は書き出し・読み込みを使ってください。</p>
</div>


<script src="questions.js"></script>
<script>

/* =========================================================
   問題データ
========================================================= */

const questions = window.RUSSIAN_QUESTIONS;
;


/* =========================================================
   学習状態
========================================================= */

let learningData = {};

const STORAGE_KEY = "russianGardenLearningData";
const BACKUP_KEY = "russianGardenLearningData_backup_before_update";
const V5_META_KEY = "russianGardenV5Meta";
let v5Meta = { lessonNumber: 0, recentLessons: [] };
try {
    const savedMeta = JSON.parse(localStorage.getItem(V5_META_KEY) || "null");
    if (savedMeta && typeof savedMeta === "object") v5Meta = Object.assign(v5Meta, savedMeta);
} catch (error) { console.warn("出題履歴を読み込めませんでした", error); }
function saveV5Meta() { localStorage.setItem(V5_META_KEY, JSON.stringify(v5Meta)); }
function migrateV5StagesOnce() {
    if (v5Meta.migrated) return;
    questions.forEach(function(q) {
        const state = learningData[q.id];
        if (!state) return;
        // v4: 3=translation, 4=listening. v5 swaps these.
        if (state.stage === 3) state.stage = 4;
        else if (state.stage === 4) state.stage = 3;
        // Low-retention archive entries need translation practice.
        else if (state.stage === 5 && Number(state.retention) < 80) state.stage = 4;
        if (state.stage === 4 && !Number.isFinite(Number(state.translationWins))) state.translationWins = 0;
    });
    v5Meta.migrated = true;
    saveLearningData();
    saveV5Meta();
}

if (localStorage.getItem(STORAGE_KEY) && !localStorage.getItem(BACKUP_KEY)) {
    localStorage.setItem(BACKUP_KEY, localStorage.getItem(STORAGE_KEY));
}


/* =========================================================
   初期データを作る
========================================================= */

function createInitialState() {
    const data = {};
    questions.forEach(function(question) {
        data[question.id] = {
            stage: 0,
            retention: 0,
            nextReview: todayString(),
            correctCount: 0,
            wrongCount: 0,
            lastResult: null,
            introduced: false
        };
    });
    return data;
}


/* =========================================================
   今日の日付
========================================================= */

function todayString() {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
}


/* =========================================================
   日付を何日後にする
========================================================= */

function addDays(days) {

    const date = new Date();

    date.setDate(date.getDate() + days);

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
}


/* =========================================================
   データ読み込み
========================================================= */

function migrateLearningData(rawData) {
    const migrated = createInitialState();
    if (!rawData || typeof rawData !== "object") return migrated;

    questions.forEach(function(question, index) {
        // Prefer stable ID keys. Legacy backups used numeric question indexes.
        const oldState = rawData[question.id] || rawData[String(index)];
        if (oldState && typeof oldState === "object") {
            migrated[question.id] = Object.assign(
                migrated[question.id],
                oldState
            );
        }
    });
    return migrated;
}

function loadLearningData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            learningData = migrateLearningData(JSON.parse(saved));
        } catch (error) {
            console.warn("保存データを読み込めませんでした。初期状態にします。", error);
            learningData = createInitialState();
        }
    } else {
        learningData = createInitialState();
    }
    saveLearningData();
}


/* =========================================================
   データ保存
========================================================= */

function saveLearningData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(learningData)
    );
}


/* =========================================================
   学習記録の書き出し・読み込み
========================================================= */

function exportLearningData() {
    const blob = new Blob(
        [JSON.stringify(Object.assign({}, learningData, { "__v5meta": v5Meta }), null, 2)],
        { type: "application/json" }
    );
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "russian-garden-backup.json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

function importLearningData(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
        try {
            const raw = JSON.parse(reader.result);
            if (!confirm("現在のこのブラウザの学習記録を、選択したバックアップで置き換えます。よろしいですか？")) {
                event.target.value = "";
                return;
            }
            learningData = migrateLearningData(raw);
            if (raw.__v5meta && typeof raw.__v5meta === "object") {
                v5Meta = Object.assign({ lessonNumber: 0, recentLessons: [] }, raw.__v5meta);
            } else {
                // Old backups must be migrated once after importing.
                v5Meta = { lessonNumber: 0, recentLessons: [] };
            }
            saveV5Meta();
            migrateV5StagesOnce();
            saveLearningData();
            alert("学習記録を読み込みました！");
            startLesson();
        } catch (error) {
            alert("読み込みに失敗しました。学習記録のJSONファイルを選んでください。");
        }
        event.target.value = "";
    };
    reader.onerror = function() {
        alert("ファイルを読み込めませんでした。");
        event.target.value = "";
    };
    reader.readAsText(file, "utf-8");
}


/* =========================================================
   ランダム化
========================================================= */

function shuffle(array) {

    const copy = array.slice();

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}


/* =========================================================
   出題対象を選ぶ
========================================================= */

function buildSession() {
    const today = todayString();
    const ids = questions.map(q => q.id);
    const byId = new Map(questions.map(q => [q.id, q]));
    const selected = [];
    const selectedSet = new Set();
    const add = id => { if (!selectedSet.has(id) && selected.length < 10) { selected.push(id); selectedSet.add(id); } };
    const introducedToday = ids.filter(id => learningData[id].introducedOn === today).length;
    const newSlots = Math.max(0, 2 - introducedToday);
    const recent = Array.isArray(v5Meta.recentLessons) ? v5Meta.recentLessons : [];
    function score(id) {
        const st = learningData[id];
        const last = recent.length && recent[recent.length - 1].includes(id);
        const recentCount = recent.slice(-3).filter(lesson => lesson.includes(id)).length;
        const dueBonus = st.nextReview && st.nextReview <= today ? 35 : 0;
        return (st.lastResult === "wrong" ? 90 : 0)
            + (100 - (Number(st.retention) || 0)) * 1.5
            + Math.min(Number(st.wrongCount) || 0, 15) * 3
            + dueBonus - (last ? 230 : 0) - recentCount * 55 + Math.random() * 35;
    }
    const ranked = arr => arr.slice().sort((a,b) => score(b)-score(a));
    // An interrupted introduction is already counted for its original day.
    const pending = ranked(ids.filter(id => learningData[id].stage === 0 && learningData[id].introduced));
    pending.forEach(add);
    const fresh = shuffle(ids.filter(id => learningData[id].stage === 0 && !learningData[id].introduced));
    fresh.slice(0, newSlots).forEach(add);
    const developing = ranked(ids.filter(id => learningData[id].stage >= 1 && learningData[id].stage <= 4));
    developing.forEach(add);
    const archived = ranked(ids.filter(id => learningData[id].stage === 5));
    // Prefer at most two archive reviews; if there are too few developing items,
    // use more archive items rather than repeating a question or returning only 2.
    archived.slice(0, 2).forEach(add);
    if (selected.length < 10) archived.forEach(add);
    // Never duplicate a question within one lesson.
    return shuffle(selected).map(id => ({ id, question: byId.get(id) }));
}

/* =========================================================
   セッション
========================================================= */

let session = [];
let currentPosition = 0;
let currentQuestion = null;

let attempts = 0;

let currentExerciseType = null;

let clozeAnswer = "";
let selectedWords = [];
let answerLocked = false;
let lastWrongTapAt = 0;


/* =========================================================
   進捗表示
========================================================= */

function updateProgress() {

    const progress = document.getElementById("progress");

    if (session.length === 0) {

        progress.textContent = "出題できる問題がありません";

        return;
    }

    progress.textContent =
        "今日の学習 " +
        (currentPosition + 1) +
        " / " +
        session.length;
}


/* =========================================================
   紹介画面
========================================================= */

function showIntroduction() {

    const q = currentQuestion.question;
    const state = learningData[currentQuestion.id];

    state.introduced = true;
    if (!state.introducedOn) state.introducedOn = todayString();

    saveLearningData();

    document.getElementById("app").innerHTML = `

        <div class="box">

            <div class="small">🌱 新しい文を覚えよう</div>

            <p class="japanese">
                🇯🇵 ${q.japanese}
            </p>

            <p class="english">
                🇬🇧 ${q.english}
            </p>

            <p class="russian">
                🇷🇺 ${q.russian}
            </p>

            <p>
                まず正しい音を聞いてみましょう。
            </p>

            <button class="audio-button" onclick="speakRussian()">
                🔊 再生
            </button>

            <p class="small">
                音を聞いたら、自分でも声に出して読んでみよう！
            </p>

            <button class="next-button" onclick="startWordOrder()">
                次へ → 並び替え
            </button>

        </div>
    `;

    updateProgress();

    speakRussian();
}


/* =========================================================
   ロシア語読み上げ
========================================================= */

function speakRussian() {

    if (!currentQuestion) return;

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            currentQuestion.question.russian
        );

    utterance.lang = "ru-RU";
    utterance.rate = 0.85;
    utterance.pitch = 1.0;

    window.speechSynthesis.speak(utterance);
}


/* =========================================================
   並び替え開始
========================================================= */

function startWordOrder() {

    attempts = 0;
    answerLocked = false;
    lastWrongTapAt = 0;

    currentExerciseType = "wordOrder";

    selectedWords = [];

    const q = currentQuestion.question;

    const words = q.russian
        .replace(/[.,!?]/g, " $&")
        .split(/\s+/)
        .filter(function(word) {

            return word !== "";

        });

    const shuffledWords = shuffle(words);

    document.getElementById("app").innerHTML = `

        <div class="box">

            <div class="small">
                ② 並び替え
            </div>

            <p class="english">
                🇬🇧 ${q.english}
            </p>

            <button onclick="speakRussian()">🔊 発音を聞く</button>
            <div id="selectedWords"></div>

            <div id="wordButtons"></div>

            <button onclick="clearSelectedWords()">
                いったん全部戻す
            </button>

            <div id="result" class="result"></div>

        </div>
    `;

    const container =
        document.getElementById("wordButtons");

    shuffledWords.forEach(function(word, index) {

        const button = document.createElement("button");

        button.textContent = word;

        button.className = "word-button";

        button.onclick = function() {

            selectWord(word, button);

        };

        container.appendChild(button);

    });

    updateProgress();
}


/* =========================================================
   単語選択
========================================================= */

function selectWord(word, button) {

    selectedWords.push({
        word: word,
        button: button
    });

    button.disabled = true;

    renderSelectedWords();

    if (selectedWords.length ===
        document.querySelectorAll(".word-button").length) {

        checkWordOrder();

    }
}


/* =========================================================
   選択済み単語表示
========================================================= */

function renderSelectedWords() {

    const container =
        document.getElementById("selectedWords");

    container.innerHTML = "";

    selectedWords.forEach(function(item, index) {

        const button = document.createElement("button");

        button.textContent = item.word;

        button.className = "selected-word";

        button.onclick = function() {

            selectedWords.splice(index, 1);

            item.button.disabled = false;

            renderSelectedWords();

        };

        container.appendChild(button);

    });
}


/* =========================================================
   並び替えリセット
========================================================= */

function clearSelectedWords() {

    selectedWords.forEach(function(item) {

        item.button.disabled = false;

    });

    selectedWords = [];

    renderSelectedWords();
}


/* =========================================================
   並び替え答え合わせ
========================================================= */

function checkWordOrder() {

    const answer =
        selectedWords
            .map(function(item) {
                return item.word;
            })
            .join(" ")
            .replace(/\s+([.,!?])/g, "$1");

    const correct =
        currentQuestion.question.russian;

    if (normalize(answer) === normalize(correct)) {

        handleCorrect();

    } else {

        handleWrong(
            "違います。もう一度並べ替えてみよう！"
        );

    }
}


/* =========================================================
   穴埋め
========================================================= */

function startCloze() {

    attempts = 0;
    answerLocked = false;
    lastWrongTapAt = 0;

    currentExerciseType = "cloze";

    const q = currentQuestion.question;

    const words = q.russian.split(" ");

    let possibleIndexes = [];

    for (let i = 0; i < words.length; i++) {
        const bare = words[i].toLowerCase().replace(/^[^\p{L}]+|[^\p{L}]+$/gu, "");
        if (/[\p{L}]/u.test(bare) && !new Set(["я","ты","он","она","оно","мы","вы","они"]).has(bare)) possibleIndexes.push(i);
    }

    if (possibleIndexes.length === 0) {

        // A pronoun-only sentence cannot make a valid cloze: use listening instead.
        startAudio();
        return;

    }

    const hiddenIndex =
        possibleIndexes[
            Math.floor(
                Math.random() *
                possibleIndexes.length
            )
        ];

    clozeAnswer = words[hiddenIndex];

    const displayWords =
        words.map(function(word, index) {

            if (index === hiddenIndex) {

                return "□□□□";

            }

            return word;

        });

    document.getElementById("app").innerHTML = `

        <div class="box">

            <div class="small">
                ③ 穴埋め
            </div>

            <p class="english">
                🇬🇧 ${q.english}
            </p>

            <p class="russian">
                🇷🇺 ${displayWords.join(" ")}
            </p>
            <button onclick="speakRussian()">🔊 発音を聞く</button>

            <input
                type="text"
                id="answerInput"
                placeholder="抜けているロシア語を入力"
                onkeydown="handleEnter(event)"
            >

            <br>

            <button onclick="checkCloze()">
                答え合わせ
            </button>

            <div id="result" class="result"></div>

        </div>
    `;

    updateProgress();
}


/* =========================================================
   英文→ロシア語
========================================================= */

function startTyping() {

    attempts = 0;
    answerLocked = false;
    lastWrongTapAt = 0;

    currentExerciseType = "typing";

    const q = currentQuestion.question;

    document.getElementById("app").innerHTML = `

        <div class="box">

            <div class="small">
                ⑤ 英文から入力
            </div>

            <p class="english">
                🇬🇧 ${q.english}
            </p>

            <button class="audio-inline" onclick="speakRussian()">🔊 発音を聞く</button>
            <br>
            <input
                type="text"
                id="answerInput"
                placeholder="ロシア語で入力"
                onkeydown="handleEnter(event)"
            >

            <br>

            <button onclick="checkTyping()">
                答え合わせ
            </button>

            <div id="result" class="result"></div>

        </div>
    `;

    updateProgress();
}


/* =========================================================
   音声→入力
========================================================= */

function startAudio() {

    attempts = 0;
    answerLocked = false;
    lastWrongTapAt = 0;

    currentExerciseType = "audio";

    const q = currentQuestion.question;

    document.getElementById("app").innerHTML = `

        <div class="box">

            <div class="small">
                ④ 音声から入力
            </div>

            <p>
                音声だけを聞いて、ロシア語を入力してください。
            </p>

            <button
                class="audio-button"
                onclick="speakRussian()"
            >
                🔊 もう一度聞く
            </button>

            <br>

            <input
                type="text"
                id="answerInput"
                placeholder="聞こえたロシア語を入力"
                onkeydown="handleEnter(event)"
            >

            <br>

            <button onclick="checkAudio()">
                答え合わせ
            </button>

            <div id="result" class="result"></div>

        </div>
    `;

    updateProgress();

    speakRussian();
}


/* =========================================================
   正規化
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[.,!?]/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   Enterキー
========================================================= */

function handleEnter(event) {

    if (event.key !== "Enter") return;

    if (currentExerciseType === "cloze") {

        checkCloze();

    } else if (currentExerciseType === "typing") {

        checkTyping();

    } else if (currentExerciseType === "audio") {

        checkAudio();

    }
}


/* =========================================================
   穴埋め答え合わせ
========================================================= */

function checkCloze() {

    const input =
        document.getElementById("answerInput");

    if (answerLocked || !input) return;
    if (!input.value.trim()) {
        const result = document.getElementById("result");
        if (result) result.textContent = "入力してから答え合わせを押してね。";
        return;
    }
    const answer = input.value;
    if (answerLocked) return;

    if (normalize(answer) === normalize(clozeAnswer)) {

        handleCorrect();

    } else {

        handleWrong(
            "🔄 もう一度！"
        );

    }
}


/* =========================================================
   英文入力答え合わせ
========================================================= */

function checkTyping() {

    const input =
        document.getElementById("answerInput");

    if (answerLocked || !input) return;
    if (!input.value.trim()) {
        const result = document.getElementById("result");
        if (result) result.textContent = "入力してから答え合わせを押してね。";
        return;
    }
    const answer = input.value;
    if (answerLocked) return;

    const correct =
        currentQuestion.question.russian;

    if (normalize(answer) === normalize(correct)) {

        handleCorrect();

    } else {

        handleWrong(
            "🔄 もう一度！"
        );

    }
}


/* =========================================================
   音声入力答え合わせ
========================================================= */

function checkAudio() {

    const input =
        document.getElementById("answerInput");

    if (answerLocked || !input) return;
    if (!input.value.trim()) {
        const result = document.getElementById("result");
        if (result) result.textContent = "入力してから答え合わせを押してね。";
        return;
    }
    const answer = input.value;
    if (answerLocked) return;

    const correct =
        currentQuestion.question.russian;

    if (normalize(answer) === normalize(correct)) {

        handleCorrect();

    } else {

        handleWrong(
            "🔄 もう一度！"
        );

    }
}


/* =========================================================
   正解処理
========================================================= */

function handleCorrect() {
    if (answerLocked) return;
    answerLocked = true;
    const state = learningData[currentQuestion.id];
    state.correctCount++;
    state.lastResult = "correct";
    state.retention = Math.min(100, (Number(state.retention) || 0) + 10);
    if (state.stage === 0) state.stage = 2;
    else if (state.stage === 1) state.stage = 2;
    else if (state.stage === 2) state.stage = 3;
    else if (state.stage === 3) { state.stage = 4; state.translationWins = 0; }
    else if (state.stage === 4) {
        // Each lesson can award at most one translation win.
        if (state.lastTranslationWinLesson !== v5Meta.lessonNumber) {
            state.translationWins = (Number(state.translationWins) || 0) + 1;
            state.lastTranslationWinLesson = v5Meta.lessonNumber;
        }
        if (state.translationWins >= 3) state.stage = 5;
    }
    scheduleNextReview(state);
    saveLearningData();
    const result = document.getElementById("result");
    if (result) result.textContent = "🎉 正解！";
    setTimeout(function() { nextQuestion(); }, 700);
}


/* =========================================================
   間違い処理
========================================================= */

function handleWrong(message) {

    if (answerLocked) return;
    // 連続タップで誤答が2回記録されるのを防ぐ。
    const now = Date.now();
    if (now - lastWrongTapAt < 700) return;
    lastWrongTapAt = now;
    attempts++;

    const state =
        learningData[currentQuestion.id];

    state.wrongCount++;

    state.lastResult = "wrong";


    /*
       1回目はその場で再挑戦
    */

    if (attempts === 1) {

        const result =
            document.getElementById("result");

        if (result) {

            result.textContent = message;

        }

        return;
    }


    /*
       2回目の失敗
       → 答えを表示
       → 次の問題ボタンを表示
    */

    answerLocked = true;
    state.retention =
        Math.max(0, state.retention - 15);


    /*
       長期保存からの失敗は強烈に落とす
    */

    if (state.stage === 5) {

        state.retention =
            Math.max(0, state.retention - 30);

        state.stage = 4;
        state.translationWins = 0;

    }


    /*
       育成中での失敗も、
       必要なら一段階戻す
    */

    else if (state.stage === 4) {
        state.translationWins = 0;
    } else if (state.stage > 1 && state.retention < 30) {
        state.stage--;
    }


    /*
       次回は早めに出す
    */

    state.nextReview = addDays(1);

    saveLearningData();


    const result =
        document.getElementById("result");

    if (result) {

        result.innerHTML = `

            ❌ 正解は
            <strong>
                ${currentQuestion.question.russian}
            </strong>
            です。

            <br><br>

            <button
                class="next-button"
                onclick="nextQuestion()"
            >
                次の問題へ →
            </button>
        `;

    }

}


/* =========================================================
   次回出題日
========================================================= */

function scheduleNextReview(state) {

    let days = 1;


    if (state.stage === 1) {

        days = 1;

    } else if (state.stage === 2) {

        days = 2;

    } else if (state.stage === 3) {

        days = 4;

    } else if (state.stage === 4) {

        days = 7;

    } else if (state.stage === 5) {

        /*
           定着度が高いほど間隔を伸ばす
        */

        if (state.retention >= 95) {

            days = 30;

        } else if (state.retention >= 90) {

            days = 21;

        } else if (state.retention >= 80) {

            days = 14;

        } else {

            days = 7;

        }

    }


    state.nextReview = addDays(days);
}


/* =========================================================
   次の問題
========================================================= */

function nextQuestion() {

    window.speechSynthesis.cancel();

    currentPosition++;

    if (currentPosition >= session.length) {

        showComplete();

        return;
    }

    currentQuestion =
        session[currentPosition];

    attempts = 0;

    const state =
        learningData[currentQuestion.id];


    /*
       NEWなら紹介
    */

    if (
        state.stage === 0 &&
        !state.introduced
    ) {

        showIntroduction();

        return;

    }


    /*
       段階によって問題形式を変える
    */

    if (state.stage === 0) {

        showIntroduction();

    } else if (state.stage === 1) {

        startWordOrder();

    } else if (state.stage === 2) {

        startCloze();

    } else if (state.stage === 3) {

        startTyping();

    } else if (state.stage === 4) {

        startAudio();

    } else {

        /*
           長期保存は、
           生存確認として音声入力
        */

        startAudio();

    }
}


/* =========================================================
   完了
========================================================= */

function showComplete() {

    window.speechSynthesis.cancel();

    document.getElementById("progress").textContent =
        "今日の学習 完了！";

    document.getElementById("app").innerHTML = `

        <div class="box complete">

            🎉 おつかれさまでした🌱

            <p class="small">
                今日も庭の手入れができました。
            </p>

            <button onclick="startLesson()">
                もう一度レッスンする
            </button>

        </div>
    `;
}


/* =========================================================
   レッスン開始
========================================================= */

function startLesson() {

    window.speechSynthesis.cancel();

    session = buildSession();
    v5Meta.lessonNumber = (Number(v5Meta.lessonNumber) || 0) + 1;
    v5Meta.recentLessons = (Array.isArray(v5Meta.recentLessons) ? v5Meta.recentLessons : [])
        .concat([session.map(item => item.id)]).slice(-5);
    saveV5Meta();

    currentPosition = 0;

    if (session.length === 0) {

        document.getElementById("app").innerHTML = `

            <div class="box complete">

                🌱 今日は出題する問題がありません。

                <p class="small">
                    みんな庭でゆっくり休んでいます。
                </p>

            </div>
        `;

        document.getElementById("progress").textContent =
            "今日の学習 0問";

        return;
    }

    currentQuestion = session[0];

    const state =
        learningData[currentQuestion.id];

    if (
        state.stage === 0 &&
        !state.introduced
    ) {

        showIntroduction();

    } else {

        nextQuestionStart();

    }
}


/* =========================================================
   レッスン最初の問題
========================================================= */

function nextQuestionStart() {

    const state =
        learningData[currentQuestion.id];

    if (state.stage === 0) {

        showIntroduction();

    } else if (state.stage === 1) {

        startWordOrder();

    } else if (state.stage === 2) {

        startCloze();

    } else if (state.stage === 3) {

        startAudio();

    } else {

        startTyping();

    }
}


/* =========================================================
   初期化
========================================================= */

loadLearningData();
migrateV5StagesOnce();
startLesson();

</script>
